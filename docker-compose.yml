services:
  claude:
    image: ghcr.io/fabianhardt/claude-raspi@sha256:a5b3c10239378e94f95b96757bbcd71ec2a1cd5e7009c771f9ea0e59d640e7c3
    container_name: claude-raspi
    hostname: claude-raspi
    restart: unless-stopped
    mem_limit: 2g
    ports:
      - "${TTYD_BIND:-0.0.0.0}:7681:7681"
    environment:
      TTYD_CREDENTIAL: ${TTYD_CREDENTIAL:?TTYD_CREDENTIAL is required}
      GH_TOKENS: ${GH_TOKENS:-}
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
      RC_SESSION_NAME: ${RC_SESSION_NAME:-Raspberry Pi}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - claude-home:/home/claude
      - workspace:/workspace

volumes:
  claude-home:
  workspace:

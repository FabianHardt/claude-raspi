services:
  claude:
    image: ghcr.io/fabianhardt/claude-raspi@sha256:4de3c89f3a1b586301151d0ea862bc82453324aaa7a4ea2bba419c99bbbd4232
    container_name: claude-raspi
    hostname: claude-raspi
    restart: unless-stopped
    mem_limit: 2g
    ports:
      - "${TTYD_BIND:-0.0.0.0}:7681:7681"
    environment:
      TTYD_CREDENTIAL: ${TTYD_CREDENTIAL:?TTYD_CREDENTIAL is required}
      GH_TOKENS: ${GH_TOKENS:-}
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
      RC_SESSION_NAME: ${RC_SESSION_NAME:-Raspberry Pi}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - claude-home:/home/claude
      - workspace:/workspace

volumes:
  claude-home:
  workspace:

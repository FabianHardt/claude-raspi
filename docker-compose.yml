services:
  claude:
    image: ghcr.io/fabianhardt/claude-raspi@sha256:3cb134f338e5fb9df5cbd10c96c5589f4ed2283a47d8526c218ce46d76d638ea
    container_name: claude-raspi
    hostname: claude-raspi
    restart: unless-stopped
    mem_limit: 2g
    ports:
      - "${TTYD_BIND:-0.0.0.0}:7681:7681"
    environment:
      TTYD_CREDENTIAL: ${TTYD_CREDENTIAL:?TTYD_CREDENTIAL is required}
      GH_TOKENS: ${GH_TOKENS:-}
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
      RC_SESSION_NAME: ${RC_SESSION_NAME:-Raspberry Pi}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - claude-home:/home/claude
      - workspace:/workspace

volumes:
  claude-home:
  workspace:

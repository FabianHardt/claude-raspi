name: Build image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # weekly uncached rebuild picks up Debian security updates
    - cron: "0 1 * * 1"

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/claude-raspi
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Portainer polls the deploy branch; it only moves once the image exists, so there is no race with the build.
      - name: Publish deploy branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          OWNER: ${{ github.repository_owner }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="ghcr.io/${OWNER,,}/claude-raspi@${DIGEST}"
          sed -E "s|^( *image:) .*claude-raspi.*$|\1 ${image}|" docker-compose.yml > "$RUNNER_TEMP/docker-compose.yml"
          grep -q "@sha256:" "$RUNNER_TEMP/docker-compose.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin +refs/heads/deploy:refs/remotes/origin/deploy; then
            git switch -c deploy origin/deploy
          else
            git switch --orphan deploy
          fi
          cp "$RUNNER_TEMP/docker-compose.yml" docker-compose.yml
          git add docker-compose.yml
          git diff --cached --quiet && exit 0
          git commit -m "Deploy ${image} (${GITHUB_SHA::7})"
          git push origin deploy

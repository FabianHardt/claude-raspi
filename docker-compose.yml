services:
  claude:
    image: ghcr.io/fabianhardt/claude-raspi@sha256:81a2c6f39476c165f393a819c4b9bbbd3e8064119b5e9501d0bf8b557b2f709d
    container_name: claude-raspi
    hostname: claude-raspi
    restart: unless-stopped
    mem_limit: 2g
    ports:
      - "${TTYD_BIND:-0.0.0.0}:7681:7681"
    environment:
      TTYD_CREDENTIAL: ${TTYD_CREDENTIAL:?TTYD_CREDENTIAL is required}
      GH_TOKENS: ${GH_TOKENS:-}
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
      RC_SESSION_NAME: ${RC_SESSION_NAME:-Raspberry Pi}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - claude-home:/home/claude
      - workspace:/workspace

volumes:
  claude-home:
  workspace:
